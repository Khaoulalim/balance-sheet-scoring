# Lance les tests automatiquement à chaque git push (onglet « Actions » sur GitHub).
# Les tests utilisent des données synthétiques (tests/synthetic.py) : pas besoin des 1,3 Go de JSON SEC.
name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installer les dépendances utiles aux tests
        run: pip install pandas==3.1.1 numpy==2.5.5 scikit-learn==1.9.1 joblib==1.6.0 pytest==9.1.1
      - name: Lancer les tests
        run: python -m pytest -q
